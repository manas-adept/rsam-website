backend:
  name: git-gateway
  branch: main

media_folder: "rsam_website"
public_folder: "rsam_website"

media_library:
  name: cloudinary
  config:
    cloud_name: "igjmhsju"
    api_key: "771583964283623"
    default_transformations: []
    folder: "rsam_website"

collections:

  - name: "news-items"
    label: "News & Circulars"
    files:
      - name: "news_data"
        label: "News Items"
        file: "data/news-items.json"
        format: json
        fields:
          - label: "News Items"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Tag"
                name: "tag"
                widget: "select"
                options:
                  - { label: "News",     value: "news"     }
                  - { label: "Circular", value: "circular" }
                  - { label: "Result",   value: "result"   }
                  - { label: "Notice",   value: "notice"   }
                default: "news"
              - { label: "Title",    name: "title",    widget: "string" }
              - { label: "Date",     name: "date",     widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Location", name: "location", widget: "string",   required: false, default: "" }
              - { label: "Body",     name: "body",     widget: "text",     hint: "Basic HTML like <b>bold</b> is supported." }
              - { label: "Link Text", name: "linkText", widget: "string",  default: "View Details" }
              - { label: "Link URL",  name: "linkHref", widget: "string",  default: "#" }

  - name: "upcoming-events"
    label: "Upcoming Events"
    media_folder: "rsam_website/events"
    public_folder: "rsam_website/events"
    files:
      - name: "events_data"
        label: "Events Carousel"
        file: "data/upcoming-events.json"
        format: json
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Event Image",  name: "image",         widget: "image",  required: false }
              - { label: "Category Label (fallback)", name: "category", widget: "string", default: "Upcoming Event", hint: "Shown only when no start/end time is set." }
              - { label: "Start Date & Time (IST)", name: "startDateTime", widget: "datetime", format: "YYYY-MM-DDTHH:mm", date_format: "YYYY-MM-DD", time_format: "HH:mm", required: false, default: "" }
              - { label: "End Date & Time (IST)",   name: "endDateTime",   widget: "datetime", format: "YYYY-MM-DDTHH:mm", date_format: "YYYY-MM-DD", time_format: "HH:mm", required: false, default: "" }
              - { label: "Display Date", name: "date",     widget: "string", hint: "e.g. May 10, 2026" }
              - { label: "Location",     name: "location", widget: "string", required: false, default: "" }
              - { label: "Title",        name: "title",    widget: "string" }
              - { label: "Description",  name: "body",     widget: "text" }
              - { label: "Link Text",    name: "linkText", widget: "string", default: "Read Circular" }
              - { label: "Link URL",     name: "linkHref", widget: "string", default: "#" }

  - name: "highlights"
    label: "Highlights"
    media_folder: "rsam_website/highlights"
    public_folder: "rsam_website/highlights"
    files:
      - name: "highlights_data"
        label: "Highlight Cards"
        file: "data/highlights.json"
        format: json
        fields:
          - label: "Highlights"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Featured Wide Card", name: "wide",   widget: "boolean", default: false, hint: "Only enable on the first item." }
              - { label: "Show in Homepage Carousel", name: "homepage_carousel", widget: "boolean", default: false, hint: "Show this highlight's images in the hero carousel on the homepage." }
              - { label: "Date",               name: "date",   widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - label: "Images"
                name: "images"
                widget: "list"
                hint: "Add multiple images to enable a swipeable gallery."
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Trophy Emoji", name: "trophy",  widget: "string", default: "🏆" }
              - { label: "Event Name",   name: "event",   widget: "string" }
              - { label: "Caption",      name: "caption", widget: "string" }
              - { label: "Body",         name: "body",    widget: "text", hint: "Basic HTML like <b>bold</b> is supported." }

  - name: "officials"
    label: "Officials"
    media_folder: "rsam_website/officials"
    public_folder: "rsam_website/officials"
    files:
      - name: "officials_data"
        label: "Association Members"
        file: "data/officials.json"
        format: json
        fields:
          - label: "Association Members"
            name: "association"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name",        name: "name",        widget: "string" }
              - { label: "Designation", name: "designation", widget: "string" }
              - label: "Badge Colour"
                name: "designationClass"
                widget: "select"
                options:
                  - { label: "President",       value: "president"  }
                  - { label: "Secretary",        value: "secretary"  }
                  - { label: "Treasurer",        value: "treasurer"  }
                  - { label: "Vice President",   value: "vp"         }
                  - { label: "Joint Secretary",  value: "joint"      }
                  - { label: "Technical",        value: "technical"  }
                  - { label: "Member",           value: "member"     }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Degrees / Qualifications", name: "degrees", widget: "string", required: false, default: "", hint: "e.g. B.Tech, MBA — shown below the name on the card" }
          - { label: "Show Committee Section", name: "committeeEnabled", widget: "boolean", default: false }
          - label: "Committee Members"
            name: "committee"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Name",        name: "name",        widget: "string" }
              - { label: "Designation", name: "designation", widget: "string" }
              - label: "Badge Colour"
                name: "designationClass"
                widget: "select"
                options:
                  - { label: "Member",          value: "member"    }
                  - { label: "Technical",        value: "technical" }
                  - { label: "Joint Secretary",  value: "joint"     }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "event-gallery"
    label: "Event Photo Showcase"
    media_folder: "rsam_website/events"
    public_folder: "rsam_website/events"
    files:
      - name: "gallery_data"
        label: "Event Albums & Photos"
        file: "data/gallery.json"
        format: json
        fields:
          - label: "Event Albums"
            name: "albums"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - { label: "Album ID", name: "id", widget: "string", hint: "Unique identifier, e.g. state-championship-2026" }
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Event Date", name: "date", widget: "string", hint: "e.g. May 10, 2026" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Category Tag", name: "category", widget: "string", default: "State Championship" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                fields:
                  - { label: "Photo", name: "src", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string" }
                  - { label: "Upload Date & Time", name: "uploadedAt", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", hint: "Used for 7-day master HQ vs auto-optimization rule" }

      - name: "gallery_config"
        label: "Gallery Subfolder Config"
        file: "data/gallery-config.json"
        format: json
        fields:
          - { label: "Cloudinary Base Path", name: "cloudinaryBasePath", widget: "string", default: "rsam_website/gallery" }
          - { label: "Default Items Per Page", name: "defaultItemsPerPage", widget: "number", default: 20 }
          - { label: "Auto-Optimize After (Days)", name: "autoOptimizeAfterDays", widget: "number", default: 7 }
          - label: "Event Subfolders Config"
            name: "folders"
            widget: "list"
            summary: "{{fields.title}} [{{fields.cloudinarySubfolder}}]"
            fields:
              - { label: "Folder ID", name: "folderId", widget: "string" }
              - { label: "Cloudinary Subfolder Path", name: "cloudinarySubfolder", widget: "string", hint: "e.g. rsam_website/gallery/event-name" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Enabled / Visible", name: "enabled", widget: "boolean", default: true }
              - { label: "Display Order", name: "displayOrder", widget: "number", default: 1 }
              - { label: "Description", name: "description", widget: "text" }
